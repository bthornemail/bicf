version: '3.8'

services:
  bicf-production:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: bicf/production:latest
    container_name: bicf-production
    restart: unless-stopped
    volumes:
      - ./src:/app/src:ro
      - ./schemas:/app/schemas:ro
    environment:
      - BICF_ENV=production
    command: ["help"]

